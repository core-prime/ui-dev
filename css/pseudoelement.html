<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        h2 {
            color: darkblue;
        }
        h3::before {
            content: "hello";
            color: aqua;
        }
        h3::after{
            content: "gg";
            color: red;
        }
        h3::first-letter{
            font-size: 30px;
            color: chocolate;
        }
        h3::first-line{
            font-weight:bolder ;
        }
    </style>
</head>
<body>
    <h2>hi everey one welcome to CSS</h2>
    <h3>welcome to programing world</h3>
</body>
</html>
