<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid {
            display: grid;

            /* grid-template-columns:200px 200px 200px; */
            /* grid-template-rows:200px 400px 200px; */

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 300px);
            grid-gap: 20px 67px;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div style="background-color: aqua;">1</div>
        <div style="background-color: red;">2</div>
        <div style="background-color: yellowgreen;">3</div>
        <div style="background-color: yellow;">4</div>
        <div style="background-color: peru;">5</div>
        <div style="background-color: purple;">6</div>

    </div>
</body>

</html>
