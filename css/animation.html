<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
<style>
    .move{
        animation: move 2s ease 4;
        margin-top: 25%;
    }
    @keyframes move {
        0% {
            transform: translateX(0%);
        }
        100% {
            transform: translateX(100%);
        }
    }

    .road {
        width: 100%;
        height: 100px;
        background: linear-gradient(black, red);
    }
    img {
        width: 150px;
        height: 80px;
        scale: 1;
    }
</style>
</head>
<body>
    <div class="move">
        <img src="magnific__photo-yellow-sports-car-side-profile-view-sleek-ae__34482.png" alt="">

    </div>
    <div class="road"></div>
</body>
</html>
