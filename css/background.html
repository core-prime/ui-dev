<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .main {
            .hm{color: white;}
            width: 50%;
            height: 200px;
            background-color: red;
            background-image: url(https://static.vecteezy.com/system/resources/thumbnails/051/420/124/small/birthday-celebration-cake-happy-birthday-background-with-copy-space-colorful-background-wallpaper-backdrop-photo.jpg);
            background-repeat: no-repeat;
            background-position: right top;
            background-size: 150px;
        }
        .sec {
            .jk{color: white;}
            background: radial-gradient(blue,black );
            width: 40%;
            height: 200px;
            box-shadow: 2px 3px 7px red;
        }
        .font {
            font-family: 'Times New Roman', Times, serif;
            font-variant: small-caps;
            font-size: medium;
            font-weight: 300;
            font-style: italic;
            /* text property */
            text-align: center;
            text-decoration: overline;
            text-transform: lowercase;
            text-shadow: 1px 2px  3px yellow;
            text-indent: 20%;
            text-decoration-color: brown;
            text-decoration-style: wavy;
            text-decoration-thickness: 1px;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 class="hm">welcome</h1>

    </div>
    <div class="sec">
        <h2 class="jk">yhoo</h2>

    </div>

    <!-- text -->
     <div class="font">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti maiores, laborum non incidunt quam, nemo doloremque pariatur voluptas, eveniet omnis tempore culpa. Atque rerum error vero laudantium. Aut, iste nihil?</p>
     </div>

</body>

</html>
