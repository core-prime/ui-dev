<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            height:100vh;
            align-items: center;
        }
        .card-container {
            perspective: 1000px;
        }
        .card{
            height: 250px;
            width: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
            cursor: pointer;
        }
        .card-container:hover .card {transform: rotate(180deg);}

        .card-front,.card-back{
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            backface-visibility: hidden;
            box-shadow: 0 10px 25px black;

        }
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .card-back {
            background: linear-gradient(purple blue);
            color: w;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpy8fSabmG_TcZLtTTiedr81bYgG0DdIkT2lpRKLgl5Q&s=10" alt="">
            </div>
            <div class="card-back">
                <h3>name</h3>
                <p>cook</p>
            </div>
        </div>
    </div>
</body>
</html>
