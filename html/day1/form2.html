<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
</head>

<body bgcolor="lightgreen">
    <tr>
        <h1>Student Registration From</h1>
    </tr>

    <form action="">
        <table>

            <tr>
                <td><label>First Name:</label></td>
                <td> <input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Last Name:</label>
                </td>
                <td> <input type="text">
                </td>
            </tr>

            <tr>
                <td><label>Date of brith:</label>
                    <select>
                        <option value="">Date</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <select>
                        <option value="">Month</option>
                        <option value="1">may</option>
                        <option value="2">june</option>
                        <option value="3">julay</option>
                    </select>
                    <select>
                        <option value="">Year</option>
                        <option value="1">1999</option>
                        <option value="2">2000</option>
                        <option value="3">2001</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td> <label>Gender</label></td>
                <td> <input type="radio" name="gender">male
                <td><input type="radio" name="gender">female
                </td>
            </tr>

            <tr>
                <td><label>Address:</label></td>
                <td><textarea cols="50" rows="10" placeholder="enter address here"></textarea>
                </td>
            </tr>

            <tr>
                <td><label>District:</label></td>
                <td> <input type="text">
                </td>
            </tr>

            <tr>
                <td><label>City:</label></td>
                <td><input type="text">
                </td>
            </tr>

            <tr>
                <td><label>Pin code:</label></td>
                <td> <input type="tel" placeholder="enter pin code" maxlength="6"> (6 digit number)
                </td>
            </tr>

            <tr>
                <td><label>State:</label></td>
                <td> <input type="text"></td>
            </tr>

            <tr>
                <td><label>Country:</label></td>
                <td><input type="text">
                </td>
            </tr>

            <tr>
                <td> <label>Email id:</label></td>
                <td><input type="text">
                </td>
            </tr>

            <tr>
                <td><label>Phone number:</label></td>
                <td><input type="tel" placeholder="enter phone no." maxlength="10"> ( Enter 10 digit number)
                </td>
            </tr>

            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr>
                        <th>Sl.No.</th>
                        <th>Examination</th>
                        <th>Name of the Board</th>
                        <th>Marks Obtained</th>
                        <th>Year of Passing</th>
                        <th>Percentage</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Class X:</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Class XII:</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Graduation:</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Masters:</td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                        <td><input type="text"></td>
                    </tr>
                </tbody>

            </table>

            <tr>
                <td> <label>Courses Applied for :</label></td>
                <td> <input type="radio" name="gender">B.Sc
                <td><input type="radio" name="gender">B.Com
                <td><input type="radio" name="gender">BA
                <td><input type="radio" name="gender">BCA
                </td>
            </tr>

            <input type="submit" value="submit">
            <input type="reset" value="reset">

            <button>submit</button>
            <button onclick="alert('button Clicked')">click</button>


    </form>

</body>

</html>
